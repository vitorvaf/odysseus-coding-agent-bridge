# Pipeline de validação — exemplo
validation:
  # Timeout padrão aplicado a comandos sem timeout explícito
  defaultTimeoutSeconds: 300

  # Comandos executados sequencialmente após o runner concluir
  steps:
    - name: restore
      command: dotnet restore
      cwd: ./
      timeoutSeconds: 600
      continueOnFailure: false

    - name: build
      command: dotnet build --no-restore
      cwd: ./
      timeoutSeconds: 900
      continueOnFailure: false
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    - name: test
      command: dotnet test --no-build
      cwd: ./
      timeoutSeconds: 1200
      continueOnFailure: true
      resultArtifacts:
        - test-results.xml

    - name: format_check
      command: dotnet format --verify-no-changes
      cwd: ./
      timeoutSeconds: 300
      continueOnFailure: true
