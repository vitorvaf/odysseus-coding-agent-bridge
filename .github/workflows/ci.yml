# OCAB Stabilization Gate — CI
# Requer:
#   - dotnet 8.0.x (cache de NuGet)
#   - docker (compose config + build + Testcontainers em integration)
# Cobertura por projeto de teste publicada como artifact.

name: ci

on:
  push:
    branches: [main, phase-1-mvp]
  pull_request:
    branches: [main, phase-1-mvp]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: restore
        run: dotnet restore OcabBridge.slnx

      - name: build
        run: dotnet build OcabBridge.slnx -c Release --no-restore

      - name: unit tests
        run: >-
          dotnet test tests/OcabBridge.UnitTests/OcabBridge.UnitTests.csproj
          -c Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/unit

      - name: contract tests
        run: >-
          dotnet test tests/OcabBridge.ContractTests/OcabBridge.ContractTests.csproj
          -c Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/contract

      - name: integration tests
        run: >-
          dotnet test tests/OcabBridge.IntegrationTests/OcabBridge.IntegrationTests.csproj
          -c Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/integration

      - name: security tests
        run: >-
          dotnet test tests/OcabBridge.SecurityTests/OcabBridge.SecurityTests.csproj
          -c Release --no-build
          --logger trx --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/security

      - name: docker compose config
        run: docker compose -f compose.yaml config --quiet

      - name: docker build (bridge)
        run: docker build -t ocab-bridge:ci -f Dockerfile .

      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-banner --redact --source .

      - name: upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7